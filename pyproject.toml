[project]
name = "world-model-playground"
version = "0.1.0"
description = "World Model Playground"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "brax>=0.14.2",
    "flax>=0.12.9",
    "imageio-ffmpeg>=0.6.0",
    "jax[cuda13]>=0.11.1",
    "mediapy>=1.2.7",
    "mlflow>=3.16.0",
    "playground",
]

[tool.uv.sources]
brax = { git = "https://github.com/google/brax.git", rev = "57d5b863fcc66a29a2e043182c07a14a3dee3a7c" }
playground = { git = "https://github.com/google-deepmind/mujoco_playground.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/world_model_playground"]
